<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIDISI</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <h2>SIDISI</h2>
      <p>Control de Acceso Técnico</p>
      <form id="login-form">
        <input type="text" id="login-user" placeholder="Usuario o Email" required autocomplete="username">
        <input type="password" id="login-pass" placeholder="Contraseña" required autocomplete="current-password">
        <button type="submit" id="login-btn">Ingresar</button>
      </form>
      <div id="login-error"></div>
    </div>
  </div>

  <header id="hd" style="display:none">
    <h1>SIDISI</h1>
    <div class="user-info">
      <span id="user-role-badge"></span>
      <button id="logout-btn">Salir</button>
    </div>
    <button id="add" style="display:none">+ CTO</button>
  </header>

  <div id="map" style="display:none"></div>
  <div id="panel"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
