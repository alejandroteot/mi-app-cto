<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIDISI</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="login-screen">
   <div id="login-screen">
    <div class="login-card">
      <!-- LOGO SIDISI -->
      <img src="img/logo_sidisi.png" alt="SidiSi Logo" class="login-logo">
      <p>Control de Acceso Técnico</p>
      
      <form id="login-form">
        <input type="text" id="login-user" placeholder="Usuario o Email" required autocomplete="username">
        <input type="password" id="login-pass" placeholder="Contraseña" required autocomplete="current-password">
        <button type="submit" id="login-btn">Ingresar</button>
      </form>
      <div id="login-error"></div>
    </div>
  </div>

  <header id="hd" style="display:none">
    <button id="menu-btn" style="display:none; font-size:18px; padding:4px 8px; margin-right:4px;">☰</button>
    <h1>SIDISI</h1>
    <div class="user-info">
      <span id="user-role-badge"></span>
      <button id="logout-btn">Salir</button>
    </div>
    <button id="add" style="display:none">+ CTO</button>
  </header>

  <!-- Menú desplegable lateral (Drawer) -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <h3>Menú Maestro</h3>
      <button id="close-drawer">✕</button>
    </div>
    <ul class="drawer-menu">
      <li id="nav-inst">📋 Instalaciones</li>
    </ul>
  </div>

  <!-- Modal de Reporte de Instalaciones -->
  <div id="inst-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Reporte de Instalaciones</h3>
        <button id="close-inst">✕</button>
      </div>
      <div class="inst-filter">
        <label>Desde: <input type="date" id="inst-from"></label>
        <label>Hasta: <input type="date" id="inst-to"></label>
        <button id="inst-filter-btn">Filtrar</button>
      </div>
      <div id="inst-list" class="inst-table-container"></div>
    </div>
  </div>

  <div id="map" style="display:none"></div>
  <div id="panel"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
